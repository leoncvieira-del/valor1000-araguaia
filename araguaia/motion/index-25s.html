<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Araguaia Motion 25s</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(../assets/fontes/poppins-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:500;src:url(../assets/fontes/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:600;src:url(../assets/fontes/poppins-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:700;src:url(../assets/fontes/poppins-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:800;src:url(../assets/fontes/poppins-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:900;src:url(../assets/fontes/poppins-latin-900-normal.woff2) format('woff2')}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;font-family:Poppins,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%}
.layer{position:absolute;left:0;top:0;width:100%;height:100%}
.t{white-space:nowrap;line-height:1}
.line{position:absolute;left:0;width:100%;display:flex;justify-content:center;gap:.22em;line-height:1;white-space:nowrap}
.line span{display:inline-block;transform-origin:50% 60%}
.ripple{width:140px;height:140px;border-radius:50%;border:7px solid #64B240;box-sizing:border-box}
.bar{position:absolute;top:-10%;height:120%}
.cardui{filter:drop-shadow(0 22px 30px rgba(20,34,60,.22)) drop-shadow(0 3px 6px rgba(20,34,60,.12))}
</style>
</head>
<body>
<div id="stage"></div>
<script>
// =====================================================================
// Araguaia · 25 s · 120 BPM — linha do tempo determinística (seek(t))
// 0–3 gancho · 3–6 app se monta · 6–9 app em uso · 9–12 assistência
// 12–15 portfólio · 15–18 barter · 18–21,5 +60 lojas · 21,5–25 assinatura
// =====================================================================
const DUR = 25;
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080, V = H > W;
const R = '../assets/recortes/';
const C = {navy:'#1E3D6C', deep:'#061331', red:'#CF312E', leaf:'#60BC4D', app:'#64B240', gray:'#F0F0F0', site:'#203783'};
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ---------- easing ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const oExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const iExpo = p => p <= 0 ? 0 : Math.pow(2, 10 * (p - 1));
const oCub = p => 1 - Math.pow(1 - p, 3);
const ioCub = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const oBack = (p, s = 1.70158) => { const c = s + 1; return 1 + c * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };

// ---------- dom helpers ----------
function el(tag, cls, parent, html) {
  const e = document.createElement(tag); if (cls) e.className = cls;
  if (html != null) e.innerHTML = html; (parent || stage).appendChild(e); return e;
}
function ow(e) { const d = e.style.display; e.style.display = ''; const w = e.offsetWidth; e.style.display = d; return w; }
function layer(parent) { return el('div', 'layer', parent); }
function show(e, v) { e.style.display = v ? '' : 'none'; }
function set(e, o) {
  if (o.o === 0) { e.style.display = 'none'; return; }
  e.style.display = '';
  const s = o.s ?? 1;
  const p3 = (o.rx || o.ry) ? `perspective(1800px) rotateX(${o.rx || 0}deg) rotateY(${o.ry || 0}deg) ` : '';
  e.style.transform = `translate(${o.x ?? 0}px,${o.y ?? 0}px) translate(-50%,-50%) ${p3}rotate(${o.r ?? 0}deg) scale(${s * (o.sx ?? 1)},${s * (o.sy ?? 1)})`;
  e.style.opacity = o.o ?? 1;
  if (!e.dataset.keepFilter) e.style.filter = o.b > .3 ? `blur(${o.b}px)` : '';
}
function img(src, parent, cls) { const e = el('img', 'abs ' + (cls || ''), parent); e.src = R + src; return e; }
function text(str, size, weight, color, parent, extra = '') {
  const d = el('div', 'abs t', parent, str);
  d.style.cssText += `font-size:${size}px;font-weight:${weight};color:${color};${extra}`;
  return d;
}
function slam(t, ti, d = .28, from = 2.1) {
  const p = P(t, ti, ti + d), e = oExpo(p);
  return {s: lerp(from, 1, e), o: t < ti ? 0 : P(t, ti, ti + .04), b: (1 - e) * 16};
}
function photo(src, parent, extra = '') {
  const d = el('div', 'abs', parent); d.style.overflow = 'hidden'; d.style.transformOrigin = '0 0';
  const i = el('img', null, d); i.src = R + src;
  i.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 45%;' + extra;
  return d;
}
function rect(e, x, y, w, h) { Object.assign(e.style, {width: w + 'px', height: h + 'px', transform: `translate(${x}px,${y}px)`}); }
function whip(t, tin, tout) {
  const a = (1 - oExpo(P(t, tin, tin + .38))) * W * .9;
  const b = -iExpo(P(t, tout, tout + .26)) * W * 1.3;
  return {dx: a + b, blur: (1 - oExpo(P(t, tin, tin + .38))) * 28 + iExpo(P(t, tout, tout + .26)) * 36};
}
const poly = pts => `polygon(${pts.map(([x, y]) => `${x}px ${y}px`).join(',')})`;

// ---------- global layers ----------
const bg = el('div', 'layer', stage);
const cam = el('div', 'layer', stage);
const S = {};
['hook', 'app', 'f2', 'port', 'barter', 'num', 'sig'].forEach(k => S[k] = layer(cam));
const fx = layer(cam);
const cursor = el('div', 'abs', cam,
  '<svg width="52" height="72" viewBox="0 0 20 28"><path d="M1.5 1.5 L1.5 22.5 L6.7 17.6 L10.2 26 L13.8 24.4 L10.4 16.3 L17.4 16.3 Z" fill="#fff" stroke="#10151c" stroke-width="1.5" stroke-linejoin="round"/></svg>');
cursor.style.filter = 'drop-shadow(0 6px 10px rgba(0,0,0,.35))'; cursor.style.transformOrigin = '0 0'; cursor.style.zIndex = 50;
const bars = layer(stage), flash = el('div', 'layer', stage), iris = el('div', 'layer', stage);
flash.style.background = '#fff'; iris.style.background = '#fff';

// =====================================================================
// 1 · GANCHO (0–3 s) — palavras na batida sobre flashes de fotos reais em duotone
// =====================================================================
const hk = {size: V ? 205 : 250};
const hookBgs = [['foto-fabrica.png', '50% 50%'], ['foto-agricultura.png', '40% 60%'], ['foto-pecuaria.png', '55% 40%'], ['app/card-banner.png', '50% 50%']]
  .map(([f, pos]) => {
    const d = photo(f, S.hook, `object-position:${pos};filter:grayscale(1) contrast(1.25) brightness(.95)`);
    const tint = el('div', null, d);
    tint.style.cssText = `position:absolute;inset:0;background:linear-gradient(160deg,#0b2a6b,${C.deep});mix-blend-mode:multiply;opacity:.9`;
    rect(d, 0, 0, W, H); return d;
  });
const hookLines = V ? [['O', 'CAMPO'], ['NÃO'], ['PODE']] : [['O', 'CAMPO'], ['NÃO', 'PODE']];
const hookTimes = {O: 0, CAMPO: .5, 'NÃO': 1, PODE: 1.5};
const hookWords = [];
hookLines.forEach((ln, i) => {
  const d = el('div', 'line', S.hook);
  d.style.cssText += `font-size:${hk.size}px;font-weight:900;color:#fff;letter-spacing:-.02em;text-shadow:0 10px 40px rgba(0,0,0,.35)`;
  const gapY = V ? 250 : 290;
  d.style.top = (H / 2 + (i - (hookLines.length - 1) / 2) * gapY - hk.size * .55) + 'px';
  ln.forEach(w => {
    const s = el('span', null, d, w);
    if (w === 'NÃO') s.style.cssText = `background:${C.red};padding:0 .14em;border-radius:.06em`;
    if (d.children.length > 1) s.style.transformOrigin = '0% 60%';
    hookWords.push({e: s, t: hookTimes[w], w, line: i, grow: d.children.length > 1});
  });
});
const esperar = text('ESPERAR.', 300, 900, '#fff', S.hook, 'letter-spacing:-.03em');
function hook(t) {
  show(S.hook, t < 3.05);
  hookBgs.forEach((d, i) => {
    const on = t >= i * .5 && t < (i + 1) * .5;
    show(d, on);
    if (on) d.firstChild.style.transform = `scale(${1.18 - .1 * P(t, i * .5, i * .5 + .5)}) translateX(${(i % 2 ? -1 : 1) * 20 * P(t, i * .5, i * .5 + .5)}px)`;
  });
  const shift = {};
  hookWords.forEach(w => { if (w.grow) { w.nat = w.nat || ow(w.e) + hk.size * .22; shift[w.line] = w.nat / 2 * (1 - ioCub(P(t, w.t, w.t + .2))); } });
  hookWords.forEach(w => {
    const k = slam(t, w.t, .3, 2.4);
    w.e.style.opacity = t < 2 ? k.o : 0;
    w.e.style.transform = `translateX(${shift[w.line] || 0}px) scale(${k.s}) translateY(${(1 - oExpo(P(t, w.t, w.t + .3))) * 40}px)`;
    w.e.style.filter = k.b > .3 ? `blur(${k.b}px)` : '';
    if (w.w === 'NÃO') w.e.style.clipPath = `inset(0 ${(1 - oExpo(P(t, 1, 1.14))) * 100}% 0 0)`;
  });
  if (t >= 2) {
    const fit = (V ? .9 : .88) * W / ow(esperar);
    const k = slam(t, 2, .32, 1.5), zp = iExpo(P(t, 2.6, 3.0));
    set(esperar, {x: W / 2, y: H / 2 + (V ? 0 : 10), s: fit * k.s * Math.exp(zp * Math.log(22)),
      sx: 1 + .05 * oCub(P(t, 2.5, 2.62)), o: k.o * (1 - P(t, 2.9, 3.0)), b: k.b + zp * 24});
  } else set(esperar, {o: 0});
}

// =====================================================================
// 2–3 · APP (3–9 s) — um único celular 3D com as telas reais; os cards da Home
// saltam da tela e flutuam; depois o cursor navega Pedidos → Faturas → NFe
// =====================================================================
const appBg = el('div', 'layer', S.app);
appBg.style.background = 'radial-gradient(120% 100% at 62% 40%, #ffffff 0%, #eef1f5 48%, #d9dfe7 100%)';
const streaks = el('div', 'abs', S.app);
streaks.style.cssText += `width:${W * 1.6}px;height:${H}px;opacity:.75;background:repeating-linear-gradient(118deg,transparent 0 170px,rgba(255,255,255,.95) 170px 173px,transparent 173px 260px)`;
const PH = {w: 623, h: 1377, sx: 14, sy: 26, sw: 594, sh: 1316};
const phone = el('div', 'abs', S.app);
phone.style.cssText += `width:${PH.w}px;height:${PH.h}px;z-index:5`;
phone.dataset.keepFilter = 1;
const phShadow = el('div', 'abs', S.app);
phShadow.style.cssText += 'width:520px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,34,60,.35),transparent);z-index:4';
const scr = el('div', null, phone);
scr.style.cssText = `position:absolute;left:${PH.sx}px;top:${PH.sy}px;width:${PH.sw}px;height:${PH.sh}px;overflow:hidden;border-radius:54px;background:#0a0f18`;
const SCREENS = ['home', 'pedidos', 'faturas', 'notas'].map(n => { const i = el('img', null, scr); i.src = R + `app/tela-${n}.png`; i.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%'; return i; });
const glare = el('div', null, scr); glare.style.cssText = 'position:absolute;left:-30%;top:-10%;width:160%;height:120%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%)';
const frame = el('img', null, phone); frame.src = R + 'app/celular-moldura.png'; frame.style.cssText = 'position:absolute;left:0;top:0';
const LA = V ? {ph: {x: 540, y: 1080, k: .68}, title: [[540, 175], [540, 300]], ts: 120, ph2: {x: 540, y: 800, k: .76}, word: {x: 540, y: 1590}}
             : {ph: {x: 1310, y: 560, k: .64}, title: [[400, 470], [400, 600]], ts: 118, ph2: {x: 640, y: 545, k: .72}, word: {x: 1390, y: 200}};
const appTitle = [['NOVO APP', C.navy], ['ARAGUAIA', C.app]].map(([s, c]) => text(s, LA.ts, 900, c, S.app, 'letter-spacing:-.02em'));
const HOMECARDS = [
  ['clima', [-360, -260], [-300, -490], 3.5], ['temp-max', [400, -350], [320, -580], 3.56], ['temp-min', [470, -215], [350, -440], 3.62],
  ['umidade', [-355, 20], [-330, -310], 3.68], ['vento', [450, -75], [340, -300], 3.74], ['banner', [-360, 300], [-190, 440], 3.8],
  ['noticia-1', [430, 230], [220, 330], 3.86], ['noticia-2', [370, 380], [200, 490], 3.92]];
const homeCards = HOMECARDS.map(([n, l, v, t0], i) => ({e: img(`app/card-${n}.png`, S.app, 'cardui'), off: V ? v : l, t0, z: (i * 3) % 5}));
homeCards.forEach(c => { c.e.style.zIndex = c.z > 2 ? 7 : 3; c.e.dataset.keepFilter = 1; });
const POP = {pedidos: ['pedido-1', 'pedido-2', 'pedido-3'], faturas: ['fatura-1', 'fatura-2'], notas: ['nota']};
const popEls = {};
Object.entries(POP).forEach(([k, arr]) => popEls[k] = arr.map(n => { const e = img(`app/card-${n}.png`, S.app, 'cardui'); e.style.zIndex = 8; e.dataset.keepFilter = 1; return e; }));
const TAPS = [['pedidos', 6.5, [226, 1196]], ['faturas', 7.0, [371, 1196]], ['notas', 7.5, [518, 1196]]];
const WORDS = {pedidos: 'PEDIDOS', faturas: 'FATURAS', notas: 'NOTAS FISCAIS'};
const appWords = Object.fromEntries(Object.entries(WORDS).map(([k, s]) => [k, text(s, V ? 104 : 92, 900, C.navy, S.app, 'letter-spacing:-.02em')]));
const appWordLine = el('div', 'abs', S.app); appWordLine.style.cssText += `height:12px;background:${C.app};border-radius:6px;transform-origin:0 50%`;
function phoneState(t) {
  const A = LA.ph, B = LA.ph2;
  const pin = P(t, 3.0, 3.55), e = oBack(pin, 1.25);
  let st = {x: A.x, y: lerp(A.y + H, A.y, e), k: A.k * lerp(.7, 1, e), rx: lerp(40, 8, oExpo(pin)), ry: lerp(-55, -20, oExpo(pin)), rz: lerp(18, 0, e)};
  const sway = P(t, 3.55, 5.6);
  st.ry += Math.sin(sway * Math.PI) * 8; st.rx -= sway * 3; st.y -= sway * 10;
  const m = ioCub(P(t, 5.55, 6.15));
  st = {x: lerp(st.x, B.x, m), y: lerp(st.y, B.y, m), k: lerp(st.k, B.k, m), rx: lerp(st.rx, 0, m), ry: lerp(st.ry, 0, m), rz: st.rz * (1 - m)};
  const oe = iExpo(P(t, 8.25, 8.95));
  st.ry += oe * 300; st.x += V ? 0 : -oe * W * .2; st.y += V ? -oe * H * .2 : 0; st.k *= 1 - oe * .35;
  st.b = oe * 18;
  return st;
}
function screenPt(st, px, py) { return [st.x + (PH.sx + px - PH.w / 2) * st.k, st.y + (PH.sy + py - PH.h / 2) * st.k]; }
function app(t) {
  show(S.app, t >= 2.95 && t < 9.05);
  streaks.style.transform = `translateX(${-W * .3 + (t - 3) * -60}px)`;
  const st = phoneState(t);
  set(phone, {x: st.x, y: st.y, s: st.k, rx: st.rx || .001, ry: st.ry, r: st.rz, o: t >= 3 ? 1 : 0});
  phone.style.filter = `drop-shadow(0 40px 50px rgba(20,34,60,.3)) drop-shadow(0 8px 14px rgba(20,34,60,.16))${st.b > .3 ? ` blur(${st.b}px)` : ''}`;
  set(phShadow, {x: st.x, y: st.y + PH.h / 2 * st.k + 30, s: st.k * 1.6, o: t >= 3.2 && t < 8.6 ? .9 : 0});
  const on = P(t, 3.3, 3.55);
  SCREENS[0].style.opacity = on; SCREENS[0].style.filter = `brightness(${1 + (1 - on) * 1.5})`;
  glare.style.transform = `translateX(${lerp(-60, 60, P(t, 3.35, 4.2))}%)`;
  let cur = 0;
  TAPS.forEach(([n, tt], i) => {
    const s = SCREENS[i + 1], p = ioCub(P(t, tt + .03, tt + .33));
    s.style.display = t >= tt ? '' : 'none'; s.style.transform = `translateX(${(1 - p) * 100}%)`;
    if (t >= tt) cur = i + 1;
  });
  SCREENS.forEach((s, i) => {
    if (i < cur) { const tt = TAPS[cur - 1][1], p = ioCub(P(t, tt + .03, tt + .33)); s.style.transform = `translateX(${-p * 30}%)`; s.style.filter = `brightness(${1 - p * .3})`; s.style.display = p >= 1 && i < cur - 1 ? 'none' : ''; }
  });
  appTitle.forEach((e, i) => {
    const k = slam(t, 3.55 + i * .15, .3, 1.9), out = iExpo(P(t, 5.45, 5.75));
    set(e, {x: LA.title[i][0] - (V ? 0 : out * W * .6), y: LA.title[i][1] - (V ? out * 400 : 0), s: k.s, o: k.o, b: k.b + out * 20});
  });
  homeCards.forEach(c => {
    const p = oBack(P(t, c.t0, c.t0 + .42), 1.5), back = ioCub(P(t, 5.3 + c.z * .03, 5.65 + c.z * .03));
    const depth = 1 + (c.z - 2) * .07;
    const fl = Math.sin((t - c.t0) * 2.2 + c.z) * 10 * P(t, c.t0 + .4, c.t0 + .9);
    const px = st.x + c.off[0] * p * depth, py = st.y + c.off[1] * p * depth + fl;
    set(c.e, {x: lerp(px, st.x, back), y: lerp(py, st.y, back), s: lerp(.35, (V ? 1.0 : 1.12) * depth, cl(p, 0, 1.2)) * (1 - back * .7),
      ry: -st.ry * .4 + (c.off[0] > 0 ? -10 : 10), rx: 4, o: t >= c.t0 && back < 1 ? 1 : 0});
  });
  TAPS.forEach(([n, tt], i) => {
    const next = TAPS[i + 1] ? TAPS[i + 1][1] : 8.2;
    const k = slam(t, tt + .05, .28, 1.8), out = iExpo(P(t, next - .02, next + .12));
    set(appWords[n], {x: LA.word.x, y: LA.word.y, s: k.s * (n === 'notas' && !V ? .9 : 1), o: t >= tt + .05 && out < 1 ? k.o * (1 - out) : 0, b: k.b + out * 12});
    popEls[n].forEach((e, j) => {
      const srcY = n === 'notas' ? 410 : (n === 'faturas' ? 428 + j * 110 : 496 + j * 250);
      const [sx0, sy0] = screenPt(st, 297, srcY);
      const ti = tt + .06 + j * .05, p = oBack(P(t, ti, ti + .3), 1.4), o2 = iExpo(P(t, next + .02, next + .18));
      const tx = V ? W / 2 + 70 + j * 18 : 1390 + j * 26;
      const ty = V ? (n === 'notas' ? 700 : 520 + j * (n === 'faturas' ? 130 : 230))
                   : (n === 'notas' ? 600 : 430 + j * (n === 'faturas' ? 140 : 205));
      set(e, {x: lerp(sx0, tx, p) + o2 * (V ? 0 : W * .4), y: lerp(sy0, ty, p) + o2 * (V ? -H * .3 : 0),
        s: lerp(st.k, V ? .98 : (n === 'notas' ? 1.05 : .92), p), ry: lerp(0, -14, p), rx: 3, o: t >= ti && o2 < 1 ? 1 : 0});
    });
  });
  appWordLine.style.width = (V ? 380 : 360) + 'px';
  set(appWordLine, {x: LA.word.x, y: LA.word.y + (V ? 82 : 74), sx: oExpo(P(t, 6.6, 6.9)), o: t >= 6.6 && t < 8.3 ? 1 : 0});
}

// =====================================================================
// 4 · ASSISTÊNCIA TÉCNICA (9–12 s) — fotos reais em tela cheia, divisão diagonal
// =====================================================================
const fAg = photo('foto-agricultura.png', S.f2);
const seam = el('div', 'abs', S.f2); seam.style.cssText += `width:${W}px;height:${H}px;background:${C.leaf};transform-origin:0 0`;
const fPe = photo('foto-pecuaria.png', S.f2);
const shade = el('div', 'abs', S.f2);
shade.style.cssText += `width:${W}px;height:${H}px;transform-origin:0 0;background:linear-gradient(180deg,rgba(6,19,49,0) 40%,rgba(6,19,49,.78) 100%)`;
const tA = text('ASSISTÊNCIA', V ? 120 : 140, 900, '#fff', S.f2, 'letter-spacing:-.02em');
const tB = text('TÉCNICA', V ? 120 : 140, 900, C.leaf, S.f2, 'letter-spacing:-.02em');
const lAg = text('AGRICULTURA', V ? 86 : 78, 800, '#fff', S.f2, 'letter-spacing:.02em;text-shadow:0 6px 30px rgba(0,0,0,.55)');
const lPe = text('PECUÁRIA', V ? 86 : 78, 800, '#fff', S.f2, 'letter-spacing:.02em;text-shadow:0 6px 30px rgba(0,0,0,.55)');
function splitPoly(p, gap) {
  if (!V) { const a = lerp(W * 1.15, W * .6, p) + gap, b = lerp(W * 1.0, W * .46, p) + gap; return [[a, 0], [W, 0], [W, H], [b, H]]; }
  const a = lerp(H * 1.1, H * .58, p) + gap, b = lerp(H * 1.0, H * .44, p) + gap; return [[0, b], [W, a], [W, H], [0, H]];
}
function f2(t) {
  show(S.f2, t >= 8.95 && t < 12.1);
  const w = whip(t, -99, 11.8);
  const zin = oExpo(P(t, 8.95, 9.5));
  rect(fAg, w.dx, 0, W, H);

const barEls = [C.leaf, C.navy].map(c => { const b = el('div', 'bar', bars); b.style.background = c; return b; });
const BW = W * 1.3 + H * .45;

const BARS = [[9.0, 1], [15.0, -1], [18.0, 1]];
function barsAt(t) {

  BARS.forEach(([tc, dir]) => {

}
function irisAt(t) {

}
function flashAt(t) {
  const o = (t >= 3.0 ? Math.max(1 - P(t, 3.0, 3.2), 0) : 0) + (t >= 2 && t < 2.08 ? .5 * (1 - P(t, 2, 2.08)) : 0);
  flash.style.opacity = o; show(flash, o > .01);
}

// =====================================================================

const CK = [], DOWN = [], RIP = [];
function kf(t, xy) { CK.push([t, xy[0], xy[1]]); }

[12.62, 13.12, 13.62].forEach(t0 => { kf(t0 - .06, sw0); kf(t0, sw0); kf(t0 + .16, [sw0[0] - (V ? 260 : 340), sw0[1] - 10]); kf(t0 + .38, sw0); DOWN.push([t0, t0 + .16]); });

const CURSOR_ON = [[6.05, 8.2], [12.35, 14.2], [15.5, 16.7], [23.1, 25]];
function cursorAt(t) {
  if (!CURSOR_ON.some(([a, b]) => t >= a && t <= b)) return null;
  let x = CK[0][1], y = CK[0][2];
  for (let i = 0; i < CK.length - 1; i++) {
    const [ta, xa, ya] = CK[i], [tb, xb, yb] = CK[i + 1];
    if (t >= ta && t <= tb) { const p = ioCub(P(t, ta, tb)); x = lerp(xa, xb, p); y = lerp(ya, yb, p); break; }
    if (t > tb) { x = xb; y = yb; }
  }
  if (t >= SWAP[0] && t <= SWAP[1]) { const b = bagPos(t); x = b.x + 40; y = b.y + 20; }
  return {x, y, down: DOWN.some(([a, b]) => t >= a && t <= b)};
}
const ripEls = RIP.map(([, , , c]) => { const r = el('div', 'abs ripple', fx); r.style.borderColor = c; return r; });

// ---------- camera shake ----------
const SHAKE = [[0, 7], [.5, 7], [1, 9], [1.5, 9], [2, 22], [3.0, 10], [3.5, 5], [6.5, 4], [7, 4], [7.5, 5], [12.05, 5], [14.45, 14], [15.0, 6], [19.5, 18], [22.0, 5]];
function shake(t) {
  let x = 0, y = 0;
  SHAKE.forEach(([ti, a]) => { if (t >= ti && t < ti + .4) { const d = Math.exp(-(t - ti) * 14) * a; x += Math.sin((t - ti) * 95) * d; y += Math.cos((t - ti) * 71) * d; } });
  return [x, y];
}

// ---------- seek ----------
window.seek = function (t) {
  const b = bgAt(t); if (b !== lastBg) { bg.style.background = b; lastBg = b; }
  hook(t); app(t); f2(t); port(t); barter(t); num(t); sig(t);
  barsAt(t); irisAt(t); flashAt(t);
  const [sx, sy] = shake(t); cam.style.transform = `translate(${sx}px,${sy}px)`;
  const c = cursorAt(t);
  if (c) { cursor.style.display = ''; cursor.style.transform = `translate(${c.x - 4}px,${c.y - 4}px) scale(${c.down ? .82 : 1})`; }
  else cursor.style.display = 'none';
  RIP.forEach(([ti, x, y], i) => { const p = P(t, ti, ti + .5); set(ripEls[i], {x, y, s: lerp(.15, 1.5, oExpo(p)), o: t >= ti && p < 1 ? 1 - p : 0}); });
